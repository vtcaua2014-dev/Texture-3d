name: Build IPA

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extrair fontes do APK
        run: |
          APK=$(find . -iname "*.apk" | head -1)
          echo "APK encontrado: $APK"
          mkdir -p Stopwatch/Fonts
          unzip -q -j "$APK" "assets/fonts/*" -d Stopwatch/Fonts
          cd Stopwatch/Fonts && for f in *\ *; do [ -e "$f" ] && mv "$f" "${f// /_}"; done; ls

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar projeto Xcode
        run: xcodegen generate

      - name: Compilar
        run: |
          xcodebuild -project Stopwatch.xcodeproj -scheme Stopwatch \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            C
