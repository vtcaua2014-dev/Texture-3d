name: Build IPA

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extrair fontes do APK
        run: |
          mkdir -p Stopwatch/Fonts
          unzip -q -j Stopwatch_3_0_6.apk "assets/fonts/*" -d Stopwatch/Fonts
          cd Stopwatch/Fonts && for f in *\ *; do [ -e "$f" ] && mv "$f" "${f// /_}"; done; ls

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar projeto Xcode
        run: xcodegen generate

      - name: Compilar
        run: |
          xcodebuild -project Stopwatch.xcodeproj -scheme Stopwatch \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Empacotar ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Stopwatch.app Payload/
          zip -qr Stopwatch.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Stopwatch-ipa
          path: Stopwatch.ipa

